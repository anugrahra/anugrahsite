# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: anugrahra/anugrahsite

media_folder: static/media
public_folder: /media

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    create: true

    fields:
      - label: Title
        name: title
        widget: string

      - label: Tagline
        name: tagline
        widget: string
        required: false

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - label: Image
        name: image
        widget: string
        required: false
        hint: "URL gambar eksternal untuk thumbnail/card dan social sharing"

      - label: Tags
        name: tags
        widget: list
        required: false
        field:
          label: Tag
          name: tag
          widget: string

      - label: Draft
        name: draft
        widget: boolean
        default: true

      - label: Body
        name: body
        widget: richtext
